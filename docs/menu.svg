<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 338" width="420" height="338" role="img" aria-label="WiFi Picker menu bar dropdown showing the current network, priority controls and nearby known Wi-Fi networks">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c4a7c"/>
      <stop offset="0.55" stop-color="#4a4284"/>
      <stop offset="1" stop-color="#6b4a82"/>
    </linearGradient>
    <clipPath id="round">
      <rect x="0" y="0" width="420" height="338" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="420" height="338" fill="url(#wall)"/>
    <circle cx="70" cy="290" r="150" fill="#ffffff" opacity="0.06"/>

    <!-- menu bar -->
    <rect width="420" height="26" fill="#101014" opacity="0.55"/>
    <rect x="296" y="3" width="24" height="20" rx="5" fill="#ffffff" opacity="0.28"/>

    <!-- our icon: wifi.circle -->
    <g fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round">
      <circle cx="308" cy="13.2" r="8.4"/>
      <path d="M303.8 11.2 a5.9 5.9 0 0 1 8.4 0"/>
      <path d="M305.6 13.9 a3.4 3.4 0 0 1 4.8 0"/>
    </g>
    <circle cx="308" cy="16.6" r="1.15" fill="#ffffff"/>

    <!-- system wifi icon -->
    <g fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" opacity="0.9">
      <path d="M327.4 11.4 a6.6 6.6 0 0 1 9.2 0"/>
      <path d="M329.4 14.2 a3.8 3.8 0 0 1 5.2 0"/>
    </g>
    <circle cx="332" cy="17.2" r="1.15" fill="#ffffff" opacity="0.9"/>

    <!-- battery -->
    <rect x="351" y="9" width="17" height="9" rx="2.5" fill="none" stroke="#ffffff" stroke-width="1.1" opacity="0.9"/>
    <rect x="352.6" y="10.6" width="10" height="5.8" rx="1.4" fill="#ffffff" opacity="0.9"/>
    <path d="M369.6 11.6 v4" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" opacity="0.6"/>

    <text x="404" y="17" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#ffffff" opacity="0.9">9:41</text>

    <!-- dropdown panel -->
    <rect x="56" y="32" width="352" height="294" rx="10" fill="#26262b" opacity="0.97"/>
    <rect x="56" y="32" width="352" height="294" rx="10" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.14"/>

    <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12">
      <!-- status block (disabled items) -->
      <text x="70" y="55" fill="#8e8e96">Current: HomeFiber_5G</text>
      <text x="70" y="77" fill="#8e8e96">Priority: High</text>
      <text x="70" y="99" fill="#8e8e96">Status: Nearby list refreshed (4)</text>

      <path d="M64 112 H400" stroke="#ffffff" opacity="0.12" stroke-width="1"/>

      <text x="70" y="133" fill="#f2f2f7">Find better Wi-Fi now</text>

      <path d="M64 146 H400" stroke="#ffffff" opacity="0.12" stroke-width="1"/>

      <text x="70" y="167" fill="#8e8e96" font-size="11">Nearby Known Wi-Fi (4)</text>

      <!-- highlighted row -->
      <rect x="62" y="174" width="340" height="22" rx="5" fill="#0a84ff"/>
      <text x="70" y="189" fill="#ffffff">✓ HomeFiber_5G  ·  High<tspan fill="#ffffff" opacity="0.75">  (-48 dBm)</tspan></text>
      <path d="M390 183 l5 3.5 l-5 3.5 z" fill="#ffffff"/>

      <text x="70" y="211" fill="#f2f2f7">HomeFiber  ·  Normal<tspan fill="#8e8e96">  (-61 dBm)</tspan></text>
      <path d="M390 205 l5 3.5 l-5 3.5 z" fill="#8e8e96"/>

      <text x="70" y="233" fill="#f2f2f7">CoffeeBar Guest  ·  Normal<tspan fill="#8e8e96">  (-74 dBm)</tspan></text>
      <path d="M390 227 l5 3.5 l-5 3.5 z" fill="#8e8e96"/>

      <text x="70" y="255" fill="#f2f2f7">My iPhone  ·  Low (auto)<tspan fill="#8e8e96">  (-52 dBm)</tspan></text>
      <path d="M390 249 l5 3.5 l-5 3.5 z" fill="#8e8e96"/>

      <path d="M64 268 H400" stroke="#ffffff" opacity="0.12" stroke-width="1"/>

      <text x="70" y="289" fill="#f2f2f7">Settings</text>
      <path d="M390 283 l5 3.5 l-5 3.5 z" fill="#8e8e96"/>

      <text x="70" y="311" fill="#f2f2f7">Quit Wi-Fi Picker</text>
      <text x="396" y="311" text-anchor="end" fill="#8e8e96">⌘Q</text>
    </g>
  </g>
</svg>
